<!DOCTYPE html>
<html>
<head>
    <title>Class Routine</title>
    <style>
        table { border-collapse: collapse; width: 100%;  }
        th, td { border: 1px solid black; padding: 8px; }
    </style>
</head>
<body>

<table>
    <tr>
        <th rowspan="2">Days</th>
        <th colspan="6">Time</th>
    </tr>
    <tr>
        <th>8:00</th>
        <th>9:00</th>
        <th>10:00</th>
        <th>11:00</th>
        <th>11:30</th>
        <th>12:30</th>
    </tr>

    <tr>
        <td>Mon</td>
        <td>Course 1</td>
        <td>Course 2</td>
        <td>Course 3</td>
        <td rowspan="5">B<br>R<br>E<br>A<br>K</td>
        <td>Course 5</td>
        <td></td>
    </tr>

    <tr>
        <td>Tue</td>
        <td colspan="2"></td>
        <td>Course 2</td>
        <td>Course 4</td>
        <td>Course 1</td>
    </tr>

    <tr>
        <td>Wed</td>
        <td>Course 3</td>
        <td colspan="2"></td>
        <td>Course 2</td>
        <td></td>
    </tr>

    <tr>
        <td>Thr</td>
        <td rowspan="2">Course 4</td>
        <td>Course 2</td>
        <td>Course 3</td>
        <td colspan="2" rowspan="2">Thesis</td>
    </tr>

    <tr>
        <td>Fri</td>
        <td></td>
        <td>Course 1</td>
    </tr>

</table>

</body>
</html>
