
<html>
<head>
    <title>Admission Form(IT23013)</title>
</head>
<body>

<h1 align="center">Student Admission Form</h1>

<form align="center">

<b>Full Name</b>
<input type="text" placeholder="Enter your full name" required>
<br>
<b>Father's Name</b>
<input type="text" placeholder="Enter father's name">

<br><br>

<b>Email Address</b>
<input type="email" placeholder="example@mail.com" required>
<br>
<b>Phone Number</b>
<input type="text" placeholder="01XXXXXXXX" required>

<br><br>

<b>Select Course</b>
<select name="course">
    <option>Web Development</option>
    <option>Graphics Design</option>
    <option>Digital Marketing</option>
    <option>App Development</option>
    <option>Cyber Security</option>
</select>

<br><br>

<b>Preferred Shift</b>
<input type="radio" name="shift">Morning
<input type="radio" name="shift">Evening

<br><br>

<b>Nationality</b>
<input type="radio" name="n">Bangladeshi
<input type="radio" name="n">Others

<br><br>

<b>Extracurricular Activities</b>
<input type="checkbox" name="a">Sports
<input type="checkbox" name="a">Debating
<input type="checkbox" name="a">Singing
<input type="checkbox" name="a">Volunteering

<br><br>

<input type="submit" value="Submit Application">

</form>

</body>
</html>
